name: Research Mali binary internals
on:
  push:
    paths: ['tools/research-mali-umd.sh', '.github/workflows/research-mali-umd.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect vendor driver metadata
        run: |
          bash -n tools/research-mali-umd.sh
          bash tools/research-mali-umd.sh | tee mali-research.txt
      - name: Upload research data
        uses: actions/upload-artifact@v4
        with:
          name: mali-research
          path: mali-research.txt
